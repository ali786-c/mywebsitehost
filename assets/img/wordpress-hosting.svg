<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="wpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0087be" />
      <stop offset="100%" stop-color="#005177" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="basePedestal" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.25" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#334155" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="290" cy="240" r="220" fill="url(#ambientGlow)" />

  <!-- Isometric Ground / Tech Pedestal -->
  <g transform="translate(40, 310)">
    <!-- Base Plate Shadow -->
    <path d="M 250 140 L 490 30 L 250 -70 L 10 30 Z" fill="#0f172a" opacity="0.06" />
    <!-- 3D Pedestal Thickness -->
    <path d="M 10 25 L 250 135 L 490 25 L 490 38 L 250 148 L 10 38 Z" fill="#94a3b8" />
    <!-- Pedestal Top Surface -->
    <path d="M 250 135 L 490 25 L 250 -75 L 10 25 Z" fill="url(#basePedestal)" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Grid Lines on Pedestal -->
    <path d="M 70 0 L 310 110" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <path d="M 130 -25 L 370 85" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <path d="M 190 -50 L 430 60" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <path d="M 430 0 L 190 110" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <path d="M 370 -25 L 130 85" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <path d="M 310 -50 L 70 60" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
  </g>

  <!-- SERVER RACK TOWER (Left side) -->
  <g transform="translate(55, 175)" filter="url(#dropShadow)">
    <!-- Server Case -->
    <rect x="0" y="0" width="135" height="170" rx="14" fill="url(#serverGrad)" stroke="#334155" stroke-width="2" />
    <rect x="6" y="6" width="123" height="158" rx="10" fill="#0b1120" />

    <!-- Top Server Blade -->
    <g transform="translate(14, 16)">
      <rect x="0" y="0" width="107" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Vent lines -->
      <line x1="8" y1="12" x2="35" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="18" x2="35" y2="18" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <!-- Status Lights -->
      <circle cx="82" cy="16" r="3.5" fill="#10b981" />
      <circle cx="82" cy="16" r="6" fill="#10b981" opacity="0.3" />
      <circle cx="95" cy="16" r="3.5" fill="#38bdf8" />
    </g>

    <!-- Middle Server Blade -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="107" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <line x1="8" y1="12" x2="35" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="18" x2="35" y2="18" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <circle cx="82" cy="16" r="3.5" fill="#10b981" />
      <circle cx="95" cy="16" r="3.5" fill="#a855f7" />
    </g>

    <!-- Bottom Server Blade -->
    <g transform="translate(14, 96)">
      <rect x="0" y="0" width="107" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <line x1="8" y1="12" x2="35" y2="12" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="18" x2="35" y2="18" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <circle cx="82" cy="16" r="3.5" fill="#10b981" />
      <circle cx="95" cy="16" r="3.5" fill="#38bdf8" />
    </g>

    <!-- NVMe Storage Drive Drawer at Base -->
    <rect x="14" y="136" width="107" height="20" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="35" y="150" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">NVMe SSD</text>
    <circle cx="92" cy="146" r="2.5" fill="#38bdf8" />
  </g>

  <!-- DATA CABLES -->
  <path d="M 190 280 C 230 280, 220 310, 260 310" stroke="#3b82f6" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 190 295 C 240 295, 235 320, 275 320" stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- MAIN LAPTOP / WORDPRESS WORKSTATION -->
  <g transform="translate(200, 105)" filter="url(#dropShadow)">
    <!-- Laptop Base (Isometric Keyboard Body) -->
    <path d="M 40 220 L 270 220 L 305 255 L 5 255 Z" fill="#cbd5e1" />
    <path d="M 5 255 L 305 255 L 300 263 L 10 263 Z" fill="#94a3b8" />
    <!-- Trackpad -->
    <rect x="125" y="235" width="60" height="15" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <!-- Keyboard Grid lines -->
    <rect x="35" y="224" width="240" height="9" rx="2" fill="#94a3b8" opacity="0.6" />

    <!-- Laptop Screen Outer Bezel -->
    <rect x="25" y="0" width="260" height="215" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Webcam -->
    <circle cx="155" cy="8" r="2.5" fill="#475569" />

    <!-- Laptop Inner Display Screen -->
    <rect x="35" y="16" width="240" height="190" rx="8" fill="url(#screenGrad)" />

    <!-- Browser / App Header bar inside display -->
    <rect x="35" y="16" width="240" height="22" rx="4" fill="#ffffff" />
    <circle cx="47" cy="27" r="3" fill="#ef4444" />
    <circle cx="56" cy="27" r="3" fill="#f59e0b" />
    <circle cx="65" cy="27" r="3" fill="#10b981" />
    <rect x="80" y="21" width="130" height="12" rx="6" fill="#f1f5f9" />
    <text x="96" y="30" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" font-weight="500">zedgehost.com/wp-admin</text>

    <!-- Sidebar in WP Dashboard -->
    <rect x="35" y="38" width="40" height="168" fill="#1e293b" />
    <rect x="42" y="48" width="26" height="4" rx="2" fill="#475569" />
    <rect x="42" y="58" width="26" height="4" rx="2" fill="#3b82f6" />
    <rect x="42" y="68" width="26" height="4" rx="2" fill="#475569" />
    <rect x="42" y="78" width="26" height="4" rx="2" fill="#475569" />

    <!-- Main WordPress Content Area in Display -->
    <!-- WordPress Official Emblem (Large Center Circle) -->
    <g transform="translate(155, 115)">
      <!-- Outer WP Blue Glow Ring -->
      <circle cx="0" cy="0" r="42" fill="url(#wpBlue)" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="38" fill="#ffffff" />
      <circle cx="0" cy="0" r="35" fill="url(#wpBlue)" />
      <circle cx="0" cy="0" r="31" fill="none" stroke="#ffffff" stroke-width="2.5" />

      <!-- Official Stylized 'W' Geometry -->
      <path d="M -17 -17 L -10 13 L -6 13 L -11 -17 Z" fill="#ffffff" />
      <path d="M 17 -17 L 10 13 L 6 13 L 11 -17 Z" fill="#ffffff" />
      <path d="M -7.5 4 L -2.5 17 L 2.5 17 L 7.5 4 L 4.5 -5 L 0 8 L -4.5 -5 Z" fill="#ffffff" />
    </g>

    <!-- WP Tagline text below emblem inside display -->
    <text x="155" y="180" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">WordPress 6.7 Ready</text>
    <text x="155" y="194" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#10b981" text-anchor="middle">● 100% Optimized &amp; Managed</text>
  </g>

  <!-- SPEED ROCKET TAKING OFF (Top Left) -->
  <g transform="translate(130, 30)" filter="url(#dropShadow)">
    <!-- Rocket Flame Trail -->
    <path d="M 28 85 Q 22 110, 18 125 Q 30 115, 34 100 Q 38 115, 48 125 Q 44 105, 38 85 Z" fill="url(#flameGrad)" />
    <path d="M 30 85 Q 26 100, 24 110 Q 31 104, 33 95 Q 36 104, 42 110 Q 39 98, 36 85 Z" fill="#fef08a" />

    <!-- Rocket Body -->
    <path d="M 33 10 C 22 30, 18 55, 18 80 L 48 80 C 48 55, 44 30, 33 10 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Rocket Nosecone -->
    <path d="M 33 10 C 26 23, 23 35, 22 45 L 44 45 C 43 35, 40 23, 33 10 Z" fill="url(#rocketGrad)" />
    <!-- Porthole Window -->
    <circle cx="33" cy="55" r="7.5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="31" cy="53" r="2.5" fill="#ffffff" />
    <!-- Left Fin -->
    <path d="M 18 65 L 4 82 L 18 80 Z" fill="url(#rocketGrad)" />
    <!-- Right Fin -->
    <path d="M 48 65 L 62 82 L 48 80 Z" fill="url(#rocketGrad)" />
  </g>

  <!-- CLOUD COMPUTING (Top Center) -->
  <g transform="translate(250, 20)" filter="url(#cardShadow)">
    <path d="M 30 45 C 20 45, 12 37, 12 28 C 12 20, 18 13, 26 12 C 29 4, 38 -2, 48 1 C 56 3, 62 10, 64 17 C 71 16, 78 22, 78 29 C 78 37, 72 45, 63 45 Z" fill="url(#glassBg)" stroke="#bae6fd" stroke-width="2" />
    <!-- Wi-Fi / Sync Icon on Cloud -->
    <path d="M 37 32 A 12 12 0 0 1 53 32" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 41 36 A 6 6 0 0 1 49 36" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="45" cy="40" r="1.8" fill="#0284c7" />
  </g>

  <!-- LIGHTNING SPEED BOLT (Right Side - LiteSpeed Turbo) -->
  <g transform="translate(450, 100)" filter="url(#dropShadow)">
    <polygon points="40,0 10,48 34,48 16,95 62,38 36,38" fill="url(#orangeGrad)" stroke="#fef3c7" stroke-width="2" />
    <!-- Sparkles -->
    <circle cx="70" cy="20" r="3" fill="#fbbf24" />
    <circle cx="5" cy="65" r="2.5" fill="#fbbf24" />
    <circle cx="55" cy="85" r="2" fill="#fbbf24" />
  </g>

  <!-- CYBER SECURITY SHIELD (Bottom Right - Free SSL & DDoS) -->
  <g transform="translate(425, 235)" filter="url(#cardShadow)">
    <!-- Shield Base -->
    <path d="M 40 5 L 75 18 C 75 52, 58 76, 40 88 C 22 76, 5 52, 5 18 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Shield Checkmark -->
    <path d="M 24 45 L 34 55 L 56 32" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FLOATING FEATURE BADGE 1: "LiteSpeed 4X" -->
  <g transform="translate(370, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="url(#glassBg)" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="18" cy="17" r="10" fill="#fef3c7" />
    <polygon points="18,10 13,18 17,18 15,24 23,16 19,16" fill="#d97706" />
    <text x="35" y="21" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">LiteSpeed 4X</text>
  </g>

  <!-- FLOATING FEATURE BADGE 2: "Free SSL Secure" -->
  <g transform="translate(390, 340)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="url(#glassBg)" stroke="#d1fae5" stroke-width="1.5" />
    <circle cx="20" cy="18" r="11" fill="#d1fae5" />
    <!-- Padlock icon -->
    <rect x="15" y="16" width="10" height="8" rx="2" fill="#059669" />
    <path d="M 17 16 L 17 13 A 3 3 0 0 1 23 13 L 23 16" stroke="#059669" stroke-width="1.8" fill="none" />
    <text x="38" y="22" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">SSL Protected</text>
  </g>

  <!-- FLOATING FEATURE BADGE 3: "99.9% Uptime" (Bottom Left) -->
  <g transform="translate(50, 370)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="url(#glassBg)" stroke="#e0e7ff" stroke-width="1.5" />
    <circle cx="20" cy="18" r="11" fill="#e0e7ff" />
    <!-- Pulse icon -->
    <path d="M 13 18 L 17 18 L 19 12 L 22 24 L 24 16 L 27 18" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="22" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">99.9% Uptime</text>
  </g>

  <!-- FLOATING FEATURE BADGE 4: "1-Click WP Install" (Top Left near rocket) -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#glassBg)" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="18" cy="17" r="10" fill="#e0f2fe" />
    <text x="14" y="21" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0284c7">W</text>
    <text x="34" y="21" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">1-Click Install</text>
  </g>
</svg>
