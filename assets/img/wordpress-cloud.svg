<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="serverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="wpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0087be" />
      <stop offset="100%" stop-color="#005177" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="cloudAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <circle cx="250" cy="190" r="170" fill="url(#cloudAura)" />

  <!-- Cloud Base Background Graphic -->
  <g transform="translate(140, 40)" filter="url(#shadow2)">
    <path d="M 50 110 C 25 110, 5 90, 5 65 C 5 45, 19 28, 38 25 C 45 8, 65 -5, 88 2 C 108 8, 122 25, 126 42 C 142 40, 158 54, 158 72 C 158 92, 144 110, 125 110 Z" fill="#ffffff" stroke="#e0f2fe" stroke-width="2.5" />
    <!-- Network Lines from Cloud -->
    <path d="M 85 110 L 85 155" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 45 110 L -10 170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 125 110 L 180 170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Server 1 (Left) -->
  <g transform="translate(60, 190)" filter="url(#shadow2)">
    <rect x="0" y="0" width="105" height="130" rx="10" fill="url(#serverGrad2)" stroke="#334155" stroke-width="1.5" />
    <rect x="10" y="15" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="27" r="3" fill="#10b981" />
    <rect x="10" y="47" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="59" r="3" fill="#38bdf8" />
    <rect x="10" y="79" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="91" r="3" fill="#10b981" />
    <text x="25" y="118" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">NODE 01</text>
  </g>

  <!-- Main Central Node with WordPress Emblem -->
  <g transform="translate(195, 170)" filter="url(#shadow2)">
    <rect x="0" y="0" width="120" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Blue Ribbon Header -->
    <rect x="0" y="0" width="120" height="34" rx="14" fill="url(#wpGrad)" />
    <rect x="0" y="20" width="120" height="14" fill="url(#wpGrad)" />
    <text x="60" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">CLOUD MASTER</text>

    <!-- WP Circular Icon -->
    <circle cx="60" cy="75" r="24" fill="url(#wpGrad)" />
    <circle cx="60" cy="75" r="21" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <text x="60" y="83" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>

    <!-- Metrics -->
    <rect x="14" y="112" width="92" height="10" rx="5" fill="#f1f5f9" />
    <rect x="14" y="112" width="75" height="10" rx="5" fill="#10b981" />
    <text x="60" y="136" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">99.99% FAILOVER</text>
  </g>

  <!-- Server 2 (Right) -->
  <g transform="translate(345, 190)" filter="url(#shadow2)">
    <rect x="0" y="0" width="105" height="130" rx="10" fill="url(#serverGrad2)" stroke="#334155" stroke-width="1.5" />
    <rect x="10" y="15" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="27" r="3" fill="#10b981" />
    <rect x="10" y="47" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="59" r="3" fill="#a855f7" />
    <rect x="10" y="79" width="85" height="24" rx="4" fill="#0f172a" />
    <circle cx="80" cy="91" r="3" fill="#10b981" />
    <text x="25" y="118" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">NODE 02</text>
  </g>

  <!-- High-Speed Interconnect Cables between servers -->
  <path d="M 165 245 L 195 245" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 315 245 L 345 245" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
</svg>
