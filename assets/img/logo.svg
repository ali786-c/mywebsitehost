<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
    <defs>
        <!-- Professional Brand Gradient from guide.md colors -->
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#836DE4" />
            <stop offset="100%" stop-color="#4E37B2" />
        </linearGradient>
    </defs>
    
    <!-- Sleek & Minimalist 'Z' Logo Mark -->
    <g transform="translate(20, 35)">
        <!-- Top bar of Z -->
        <path d="M 0 0 L 40 0" stroke="url(#brandGrad)" stroke-width="14" stroke-linecap="round" />
        <!-- Diagonal bar of Z -->
        <path d="M 40 0 L 15 45" stroke="url(#brandGrad)" stroke-width="14" stroke-linecap="round" />
        <!-- Bottom bar of Z -->
        <path d="M 15 45 L 55 45" stroke="url(#brandGrad)" stroke-width="14" stroke-linecap="round" />
        
        <!-- Modern accent dots/nodes -->
        <circle cx="62" cy="0" r="7" fill="#836DE4" />
        <circle cx="-8" cy="45" r="7" fill="#4E37B2" />
    </g>

    <!-- Professional Typography -->
    <g transform="translate(115, 78)">
        <!-- "Zedge" part: Bold and Authoritative -->
        <text x="0" y="0" font-family="'Inter', 'Helvetica Neue', system-ui, sans-serif" font-size="56" font-weight="900" fill="#111111" letter-spacing="-2">Zedge</text>
        
        <!-- "host" part: Light, Clean and Modern -->
        <text x="160" y="0" font-family="'Inter', 'Helvetica Neue', system-ui, sans-serif" font-size="56" font-weight="300" fill="url(#brandGrad)" letter-spacing="-1">host</text>
    </g>
</svg>
